name: Build APK

# Builds a sideloadable debug APK from the Android project in twa-app/ and
# publishes it as a GitHub Release with a direct, no-login download link.
# The artifact upload is kept too, for logged-in developers.

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build-apk:
    name: Build sideloadable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
      TERM: dumb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          # Accept licenses separately. Piping `yes` into sdkmanager fails
          # under GitHub's pipefail (SIGPIPE), which killed this step.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Bump versionCode for this build
        working-directory: twa-app
        run: |
          BASE_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          sed -i "s/versionCode .*/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${BASE_NAME}+build.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          echo "Built as versionCode=${GITHUB_RUN_NUMBER}, versionName=${BASE_NAME}+build.${GITHUB_RUN_NUMBER}"

      - name: Make gradlew executable
        run: chmod +x twa-app/gradlew

      - name: Build debug APK
        working-directory: twa-app
        run: |
          timeout 20m ./gradlew assembleDebug \
            --no-daemon --console=plain --no-watch-fs --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminalapi-debug-apk
          path: twa-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          cp twa-app/app/build/outputs/apk/debug/app-debug.apk "terminalapi-${TAG}.apk"
