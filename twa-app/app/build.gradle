plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiintegrated.terminalapi'
    compileSdk 35

    defaultConfig {
        applicationId "com.aiintegrated.terminalapi"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves bundled assets over https://appassets.androidplatform.net so the
    // WebView can keep file access disabled while still loading local files.
    implementation 'androidx.webkit:webkit:1.12.1'
}
