plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiintegrated.terminalapi'
    compileSdk 35

    defaultConfig {
        applicationId "com.aiintegrated.terminalapi"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    // Stable, checked-in debug signing key so every CI build shares one
    // signature and installs OVER the previous version (Android blocks updates
    // when signatures differ). This is a throwaway debug key, safe to commit.
    signingConfigs {
        debug {
            storeFile file("keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves bundled assets over https://appassets.androidplatform.net so the
    // WebView can keep file access disabled while still loading local files.
    implementation 'androidx.webkit:webkit:1.12.1'
}
