# --- Anti-hang settings for CI (and faster local builds) ---
# The Gradle daemon is the #1 cause of a build "hanging" in GitHub Actions: it
# is a long-lived background JVM that can hold the step's pipe open so the job
# never returns, or deadlock as a stale daemon. Disable it so every invocation
# is a clean, single-shot build that exits.
org.gradle.daemon=false
# File-system watching stalls inside the sandboxed CI container — turn it off.
org.gradle.vfs.watch=false
# Non-interactive, non-animated output (no TTY on a runner to render to).
org.gradle.console=plain
org.gradle.daemon.idletimeout=0

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
